<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chicken Invaders PWA</title>
  
  <!-- Cấu hình PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0c10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * { touch-action: manipulation; }
    body {
      margin: 0; padding: 0;
      background-color: #0b0c10; color: #fff;
      font-family: sans-serif;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      min-height: 100vh; overflow: hidden;
    }
    h1 { color: #66fcf1; margin: 5px 0; font-size: 20px; }
    canvas {
      border: 2px solid #66fcf1;
      border-radius: 10px;
      background-color: #000;
      touch-action: none;
    }
    p { font-size: 12px; color: #aaa; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>🐔 BẮN GÀ OFFLINE 🚀</h1>
  <canvas id="gameCanvas" width="360" height="500"></canvas>
  <p>Vuốt màn hình để di chuyển tàu!</p>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 60,
      width: 40,
      height: 40,
      speed: 6,
      score: 0
    };

    let bullets = [];
    let chickens = [];
    let gameOver = false;

    function createChickens() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 6; c++) {
          chickens.push({
            x: 35 + c * 50,
            y: 40 + r * 45,
            width: 30,
            height: 30,
            alive: true
          });
        }
      }
    }
    createChickens();

    // Điều khiển bằng vuốt cảm ứng trên điện thoại
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touchX = e.touches[0].clientX - rect.left;
      player.x = touchX - player.width / 2;
    });

    // Tự động bắn đạn liên tục
    setInterval(() => {
      if (!gameOver) {
        bullets.push({
          x: player.x + player.width / 2 - 3,
          y: player.y,
          width: 6,
          height: 15,
          speed: 8
        });
      }
    }, 250);

    function update() {
      if (gameOver) return;

      bullets.forEach((bullet, index) => {
        bullet.y -= bullet.speed;
        if (bullet.y < 0) bullets.splice(index, 1);
      });

      bullets.forEach((bullet, bIndex) => {
        chickens.forEach((chicken) => {
          if (chicken.alive &&
              bullet.x < chicken.x + chicken.width &&
              bullet.x + bullet.width > chicken.x &&
              bullet.y < chicken.y + chicken.height &&
              bullet.y + bullet.height > chicken.y) {
            chicken.alive = false;
            bullets.splice(bIndex, 1);
            player.score += 10;
          }
        });
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Vẽ tàu
      ctx.fillStyle = '#66fcf1';
      ctx.beginPath();
      ctx.moveTo(player.x + player.width / 2, player.y);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.fill();

      // Vẽ đạn
      ctx.fillStyle = '#ff4d4d';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      // Vẽ gà 🐔
      ctx.font = '24px serif';
      chickens.forEach(c => {
        if (c.alive) ctx.fillText('🐔', c.x, c.y + c.height);
      });

      ctx.fillStyle = '#fff';
      ctx.font = '16px Arial';
      ctx.fillText('Điểm: ' + player.score, 10, 25);
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }
    gameLoop();
    </script>
    

  <!-- Đăng ký Service Worker để chạy Offline -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW đã hoạt động!'))
          .catch(err => console.log('Lỗi SW:', err));
      });
    }
  </script>
</body>
</html>
