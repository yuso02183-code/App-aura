<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aura Fishing Survival - Prototype</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { background: #1a1a1a; font-family: sans-serif; overflow: hidden; color: white; }
        #gameCanvas { width: 100vw; height: 100vh; display: block; }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        .stat-bar { background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; margin-bottom: 5px; font-size: 14px; }
        #joystick-container { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        #joystick-stick { width: 50px; height: 50px; background: rgba(255,255,255,0.6); border-radius: 50%; position: absolute; }
        #msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; font-weight: bold; color: #ff4d4d; background: rgba(0,0,0,0.8); padding: 15px 25px; border-radius: 10px; display: none; text-align: center; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat-bar" id="status">Trạng thái: Trên đảo</div>
        <div class="stat-bar" id="boatStatus">Thuyền: Thuyền Thúng (Nhỏ)</div>
    </div>

    <div id="msg">SÓNG LỚN ĐÁNH LẬT THUYỀN!<br><span style="font-size:16px; color:#fff;">Đang hồi sinh về Cột Mốc Lưu...</span></div>

    <div id="joystick-container">
        <div id="joystick-stick"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        // Thế giới game
        const island = { x: 0, y: 0, radius: 250 };
        const savePoint = { x: 0, y: -50, radius: 25 };

        // Người chơi
        const player = {
            x: 0,
            y: 0,
            speed: 3,
            isBoat: false,
            respawnX: 0,
            respawnY: -50
        };

        // Điều khiển Joystick
        let joyX = 0, joyY = 0;
        let isDragging = false;
        const joyContainer = document.getElementById("joystick-container");
        const joyStick = document.getElementById("joystick-stick");

        joyContainer.addEventListener("touchstart", handleTouch);
        joyContainer.addEventListener("touchmove", handleTouch);
        joyContainer.addEventListener("touchend", () => {
            joyX = 0; joyY = 0;
            joyStick.style.transform = `translate(0px, 0px)`;
            isDragging = false;
        });

        function handleTouch(e) {
            e.preventDefault();
            const rect = joyContainer.getBoundingClientRect();
            const touch = e.touches[0];
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const dist = Math.hypot(dx, dy);
            const maxDist = 40;

            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }

            joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
            joyX = dx / maxDist;
            joyY = dy / maxDist;
        }

        // Bàn phím cho PC
        const keys = {};
        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        let isRespawning = false;

        function update() {
            if (isRespawning) return;

            // Xử lý di chuyển
            let moveX = joyX;
            let moveY = joyY;

            if (keys["ArrowUp"] || keys["w"]) moveY = -1;
            if (keys["ArrowDown"] || keys["s"]) moveY = 1;
            if (keys["ArrowLeft"] || keys["a"]) moveX = -1;
            if (keys["ArrowRight"] || keys["d"]) moveX = 1;

            player.x += moveX * player.speed;
            player.y += moveY * player.speed;

            // Khoảng cách tới tâm đảo
            const distToCenter = Math.hypot(player.x, player.y);

            // Kiểm tra trạng thái trên đảo hay dưới nước
            if (distToCenter < island.radius) {
                player.isBoat = false;
                document.getElementById("status").innerText = "Trạng thái: Trên đảo";
            } else {
                player.isBoat = true;
                document.getElementById("status").innerText = "Trạng thái: Đang lái thuyền";
            }

            // Cơ chế sóng lớn lật thuyền khi ra xa bờ (> 600px)
            if (player.isBoat && distToCenter > 600) {
                triggerCapized();
            }
        }

        function triggerCapized() {
            isRespawning = true;
            document.getElementById("msg").style.display = "block";

            setTimeout(() => {
                player.x = player.respawnX;
                player.y = player.respawnY;
                document.getElementById("msg").style.display = "none";
                isRespawning = false;
            }, 2000);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Camera đi theo người chơi
            ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

            // 1. Vẽ Đại Dương
            ctx.fillStyle = "#1e3d59";
            ctx.fillRect(player.x - canvas.width, player.y - canvas.height, canvas.width * 2, canvas.height * 2);

            // Vẽ vùng biển nguy hiểm (Ranh giới sóng lớn)
            ctx.beginPath();
            ctx.arc(0, 0, 600, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 50, 50, 0.5)";
            ctx.lineWidth = 10;
            ctx.stroke();

            // 2. Vẽ Hòn Đảo
            ctx.beginPath();
            ctx.arc(island.x, island.y, island.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#76b852";
            ctx.fill();

            // 3. Vẽ Cột Mốc Lưu (Save Point)
            ctx.beginPath();
            ctx.arc(savePoint.x, savePoint.y, savePoint.radius, 0, Math.PI * 2);
            ctx.fillStyle = "#f39c12";
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.font = "12px sans-serif";
            ctx.fillText("SAVE", savePoint.x - 15, savePoint.y + 4);

            // 4. Vẽ Nhân Vật / Thuyền
            ctx.beginPath();
            if (!player.isBoat) {
                // Vẽ Nhân vật (Hình tròn đỏ)
                ctx.arc(player.x, player.y, 15, 0, Math.PI * 2);
                ctx.fillStyle = "#e74c3c";
            } else {
                // Vẽ Thuyền thúng (Hình bầu dục nâu)
                ctx.ellipse(player.x, player.y, 22, 14, 0, 0, Math.PI * 2);
                ctx.fillStyle = "#8e44ad";
            }
            ctx.fill();

            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            update();
            draw();
        }

        gameLoop();
    </script>
</body>
    </html>
