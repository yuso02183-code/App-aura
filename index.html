<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura 2.5 Assistant</title>
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkF1cmEgMi41IEFzc2lzdGFudCIsCiAgInNob3J0X25hbWUiOiAiQXVyYSIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMTIxMjEyIiwKICAidGhlbWVfY29sb3IiOiAiIzEyMTIxMiIKfQ==">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1e1e1e;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #00ff87;
            border-bottom: 1px solid #333;
            letter-spacing: 1px;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
        }
        .aura-msg {
            background-color: #1e293b;
            color: #60a5fa;
            align-self: flex-start;
            border-left: 3px solid #3b82f6;
        }
        .user-msg {
            background-color: #059669;
            color: #ffffff;
            align-self: flex-end;
        }
        #input-container {
            display: flex;
            padding: 12px;
            background-color: #1e1e1e;
            border-top: 1px solid #333;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
            font-size: 15px;
        }
        button {
            margin-left: 8px;
            padding: 12px 18px;
            background-color: #00ff87;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>⚡ AURA 2.5 ASSISTANT ⚡</header>
    <div id="chat-container">
        <div class="message aura-msg">Khẳng định: **Aura 2.5 đã khởi tạo thành công trên thiết bị của bạn!** 😼⚡<br>Bắt đầu chiến thôi nào!</div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Gửi</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            const chat = document.getElementById('chat-container');
            
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-msg';
            userMsg.textContent = text;
            chat.appendChild(userMsg);

            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                const auraMsg = document.createElement('div');
                auraMsg.className = 'message aura-msg';
                auraMsg.innerHTML = 'Khẳng định: **Đã nhận phản hồi!** 😼⚡<br>Aura 2.5 đang hoạt động siêu mượt trên Web App!';
                chat.appendChild(auraMsg);
                chat.scrollTop = chat.scrollHeight;
            }, 600);
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('data:text/javascript;base64,c2VsZi5hZGRFdmVudExpc3RlbmVyKCdmZXRjaCcsIGV2ZW50ID0+IHsgZXZlbnQucmVzcG9uZFdpdGgoZmV0Y2goZXZlbnQucmVxdWVzdCkpOyB9KTs=');
        }
    </script>
</body>
  </html>
